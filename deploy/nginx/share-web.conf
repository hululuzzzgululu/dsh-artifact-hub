# Artifact Hub and share-web are served by one Nginx instance. The frontend is
# static: copy apps/share-web/dist/* to /usr/share/nginx/html/share-web/.

upstream artifact_hub {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html/share-web;
    index index.html;

    # Share tokens are credentials. Avoid persisting them in the standard log.
    location ^~ /s/ {
        access_log off;
        try_files $uri /index.html;

        add_header Cache-Control "private, no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Only the read-only public API is internet-facing. Management APIs stay on
    # the Hub's private network and are used by the DSH Host plugin.
    location ^~ /api/public/shares/ {
        access_log off;
        proxy_pass http://artifact_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        return 404;
    }
}
